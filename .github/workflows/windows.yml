name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify sharing set
        shell: pwsh
        run: ./tools/check-share.ps1
      - name: Build
        run: dotnet build SteamCardPilot.slnx -c Release
      - name: Engine tests
        run: dotnet test src/engine/ArchiSteamFarm.Tests/ArchiSteamFarm.Tests.csproj -c Release --no-build
      - name: Desktop checks
        run: dotnet run --project tests/SteamCardPilot.Checks -c Release --no-build
      - name: Theme checks
        run: dotnet run --project tests/SteamCardPilot.UiChecks -c Release --no-build
      - name: Package desktop and engine
        shell: pwsh
        run: ./tools/publish-windows.ps1 -FrameworkDependent
      - name: Local engine integration checks
        run: dotnet run --project tests/SteamCardPilot.Checks -c Release --no-build -- dist/SteamCardPilot/engine
