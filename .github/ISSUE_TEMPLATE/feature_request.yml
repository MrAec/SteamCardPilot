name: Feature request
description: Suggest an improvement to Steam Card Pilot.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user flow and any alternatives you considered.
    validations:
      required: true
