name: Bug report
description: Report a reproducible problem in Steam Card Pilot.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic account names. Do not include passwords, Steam Guard secrets, account configuration, Family View PINs, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "1.2.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and installation method
      placeholder: "Windows 11 x64; built from source"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostic information
      description: Optional screenshots or excerpts with all personal information removed.
